<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de Actividad - Nexus Ecoruta</title>
  <link rel="stylesheet" href="../css/index.css" />
  <style>
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid #1b5e20;
      outline-offset: 2px;
      border-radius: 6px;
    }

    html[data-theme="dark"] button:focus-visible,
    html[data-theme="dark"] a:focus-visible,
    html[data-theme="dark"] input:focus-visible,
    html[data-theme="dark"] select:focus-visible,
    html[data-theme="dark"] [tabindex]:focus-visible {
      outline-color: #a5d6a7;
    }
  </style>
</head>
<body>
  <header>
    <div class="header">
      <div class="brand">
        <img src="../assets/imagenes/Logo.png" alt="Logo Nexus Ecoruta" class="logo" width="120" height="45" />
        <div>
          <h1 class="brand-name">Nexus Ecoruta</h1>
          <p data-i18n="brand.subtitle">Turismo Sustentable en La Araucanía</p>
        </div>
      </div>
      <nav style="display: flex; gap: 0.5rem; align-items: center;">
        <a href="../index.html" data-i18n="nav.inicio">Inicio</a>
        <a href="emprendimientos.html" data-i18n="nav.emprendimientos">Emprendimientos</a>
        <a href="contacto.html" data-i18n="nav.contacto">Contacto</a>
        <select id="language-selector" aria-label="Seleccionar idioma" style="padding: 0.3rem 0.5rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--surface); color: var(--text-dark); font-weight: 600; cursor: pointer;">
          <option value="es">🇪🇸 Español</option>
          <option value="en">🇬🇧 English</option>
        </select>
        <select id="theme-selector" aria-label="Seleccionar modo de visualización" style="padding: 0.3rem 0.5rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--surface); color: var(--text-dark); font-weight: 600; cursor: pointer;">
          <option value="normal">☀️ Normal</option>
          <option value="dark">🌙 Oscuro</option>
          <option value="colorblind">👁️ Daltónico</option>
        </select>
      </nav>
    </div>
  </header>

  <main style="max-width: 1100px; margin: 2rem auto; padding: 0 1rem;">
    <div style="margin-bottom: 1.5rem;">
      <a href="../index.html" style="color: var(--primary); text-decoration: none; font-weight: bold;" data-i18n="detalle.volver">← Volver al catálogo</a>
    </div>
    <div id="detalle-actividad">
      <p style="text-align: center; font-size: 1.2rem; color: var(--text-muted); padding: 3rem 0;" data-i18n="detalle.cargando">Cargando información de la actividad...</p>
    </div>
  </main>

  <footer>
    <span data-i18n="footer.text">EcoRuta Temuco • Información local y accesible</span>
    <div>
      <a href="../documentos/reportes/reporte-bug-bounty.pdf" target="_blank" rel="noopener">Bug Bounty</a>
      <a href="contacto.html" data-i18n="footer.contacto">Contacto</a>
    </div>
  </footer>

  <script src="../js/translations.js"></script>
  <script src="../js/i18n.js"></script>
  <script type="module" src="../js/actividad.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const selector = document.getElementById("language-selector");
      if (selector) {
        selector.value = localStorage.getItem("selectedLang") || "es";
        selector.addEventListener("change", (e) => {
          localStorage.setItem("selectedLang", e.target.value);
          if (typeof changeLanguage === "function") {
            changeLanguage(e.target.value);
          }
        });
      }

      const themeSelector = document.getElementById("theme-selector");
      if (themeSelector) {
        const savedTheme = localStorage.getItem("selectedTheme") || "normal";
        themeSelector.value = savedTheme;
        applyTheme(savedTheme);
        themeSelector.addEventListener("change", (e) => {
          const selectedTheme = e.target.value;
          localStorage.setItem("selectedTheme", selectedTheme);
          applyTheme(selectedTheme);
        });
      }

      function applyTheme(theme) {
        if (theme === "normal") {
          document.documentElement.removeAttribute("data-theme");
        } else {
          document.documentElement.setAttribute("data-theme", theme);
        }
      }

      const detalleContenedor = document.getElementById("detalle-actividad");
      if (detalleContenedor) {
        const habilitarTecladoDots = () => {
          const dots = detalleContenedor.querySelectorAll(".carrusel-dots span");
          dots.forEach((dot, idx) => {
            if (!dot.hasAttribute("role")) {
              dot.setAttribute("role", "button");
              dot.setAttribute("tabindex", "0");
              dot.setAttribute("aria-label", `Ver imagen ${idx + 1}`);
              dot.addEventListener("keydown", (ev) => {
                if (ev.key === "Enter" || ev.key === " ") {
                  ev.preventDefault();
                  dot.click();
                }
              });
            }
          });
        };

        habilitarTecladoDots();
        const observer = new MutationObserver(habilitarTecladoDots);
        observer.observe(detalleContenedor, { childList: true, subtree: true });
      }
    });
  </script>
</body>
</html>
