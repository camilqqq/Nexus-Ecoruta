<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoRuta Temuco - Emprendedores</title>
    <link rel="stylesheet" href="emprendedor.css" />
  </head>

  <body>

    <header>
      <div class="header-top">
        <div class="brand">
          <img src="assets/Img/Logo.png" alt="Logo EcoRuta Temuco" class="logo" />
          <span class="brand-name">EcoRuta Temuco</span>
        </div>
        <button class="menu-btn" aria-label="Abrir menú">☰ Menú</button>
      </div>

      <nav>
        <a href="index.html">Inicio</a>
        <a href="index.html#explorar">Explorar</a>
        <a href="emprendedor.html" class="active">Emprendimientos</a>
      </nav>
    </header>

    <main>
      <h1>"Da a conocer tu emprendimiento"</h1>

      <form class="form-card">
        <div class="form-group">
          <label for="nombreEmprendimiento">Nombre emprendimiento</label>
          <input
            type="text"
            id="nombreEmprendimiento"
            placeholder="Ej. Guías Locales Ñielol"
            required
          />
        </div>

        <div class="form-group">
          <label for="descripcionActividad">Descripción de la actividad</label>
          <textarea
            id="descripcionActividad"
            rows="3"
            placeholder="Describe en qué consiste la experiencia..."
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="ubicacion">Ubicación</label>
          <input type="text" id="ubicacion" placeholder="Ej. Calle Prat 123, Temuco" required />
        </div>

        <div class="form-group">
          <label for="duracionDificultad">Duración y dificultad</label>
          <input
            type="text"
            id="duracionDificultad"
            placeholder="Ej. 2 horas · Dificultad Fácil"
            required
          />
        </div>

        <div class="form-group">
          <label for="recomendacionesCondiciones">Recomendaciones y condiciones</label>
          <textarea
            id="recomendacionesCondiciones"
            rows="2"
            placeholder="Ej. Traer zapatillas cómodas. Prohibido fumar."
          ></textarea>
        </div>

        <div class="form-group">
          <label>Canal principal de contacto</label>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" name="contacto" value="whatsapp" />
              WhatsApp
            </label>

            <label class="checkbox-item">
              <input type="checkbox" name="contacto" value="email" />
              Correo
            </label>

            <label class="checkbox-item">
              <input type="checkbox" name="contacto" value="instagram" />
              Instagram
            </label>
          </div>
        </div>

        <button type="submit" class="btn-submit">Enviar información</button>
      </form>
    </main>

    <footer>
      <div class="footer-links">
        <a href="#contacto">Contacto</a>
        <a href="#accesibilidad">Accesibilidad</a>
        <a href="#informacion">Información</a>
      </div>
    </footer>
  </body>
</html>
