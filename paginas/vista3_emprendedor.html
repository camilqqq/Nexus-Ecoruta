<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoRuta Temuco - Emprendedores</title>
    <link rel="stylesheet" href="../css/emprendedor.css" />
  </head>

  <body>
    <header>
      <div class="header-top">
        <div class="brand">
          <img src="../assets/imagenes/Logo.png" alt="Logo EcoRuta Temuco" class="logo" />
          <span class="brand-name">EcoRuta Temuco</span>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
          <!-- Selector de idioma con Banderas -->
          <div class="custom-lang-wrapper" id="langDropdownWrapper">
            <div class="custom-lang-selected" id="langSelected">
              <span id="langFlag">🇪🇸</span> <span id="langText">Español</span>
              <span style="font-size: 0.75rem; margin-left: auto;">▼</span>
            </div>
            <div class="custom-lang-dropdown" id="langMenu">
              <div class="custom-lang-option" data-value="es" data-flag="🇪🇸" data-name="Español">
                <span>🇪🇸</span> Español
              </div>
              <div class="custom-lang-option" data-value="en" data-flag="🇬🇧" data-name="English">
                <span>🇬🇧</span> English
              </div>
            </div>
          </div>

          <!-- Selector de Tema -->
          <select id="theme-selector" aria-label="Seleccionar modo de visualización" style="padding: 0.3rem 0.5rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--surface); color: var(--text-dark); font-weight: 600; cursor: pointer;">
            <option value="normal">☀️ Normal</option>
            <option value="dark">🌙 Oscuro</option>
            <option value="colorblind">👁️ Daltónico</option>
          </select>
          <button class="menu-btn" aria-label="Abrir menú" id="menuBtn">☰ Menú</button>
        </div>
      </div>

      <nav id="menuNav" aria-label="Menú principal">
        <a href="../index.html" data-i18n="nav.inicio">Inicio</a>
        <a href="emprendimientos.html" data-i18n="nav.emprendimientos">Emprendimientos</a>
        <a href="vista3_emprendedor.html" class="active" aria-current="page" data-i18n="nav.emprendedores">Emprendedores</a>
        <a href="contacto.html" data-i18n="nav.contacto">Contacto</a>
      </nav>
    </header>

    <main>
      <h1 data-i18n="emprendedor.titulo">"Da a conocer tu emprendimiento"</h1>

      <form class="form-card" id="formEmprendedor">
        <div class="form-group">
          <label for="nombreEmprendimiento" data-i18n="emprendedor.lblNombre">Nombre emprendimiento</label>
          <input
            type="text"
            id="nombreEmprendimiento"
            placeholder="Ej. Guías Locales Ñielol"
            data-i18n-placeholder="emprendedor.phNombre"
            required
          />
        </div>

        <div class="form-group">
          <label for="descripcionActividad" data-i18n="emprendedor.lblDesc">Descripción de la actividad</label>
          <textarea
            id="descripcionActividad"
            rows="3"
            placeholder="Describe en qué consiste la experiencia..."
            data-i18n-placeholder="emprendedor.phDesc"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="ubicacion" data-i18n="emprendedor.lblUbi">Ubicación</label>
          <input type="text" id="ubicacion" placeholder="Ej. Calle Prat 123, Temuco" data-i18n-placeholder="emprendedor.phUbi" required />
        </div>

        <div class="form-group">
          <label for="duracionDificultad" data-i18n="emprendedor.lblDur">Duración y dificultad</label>
          <input
            type="text"
            id="duracionDificultad"
            placeholder="Ej. 2 horas · Dificultad Fácil"
            data-i18n-placeholder="emprendedor.phDur"
            required
          />
        </div>

        <div class="form-group">
          <label for="recomendacionesCondiciones" data-i18n="emprendedor.lblRec">Recomendaciones y condiciones</label>
          <textarea
            id="recomendacionesCondiciones"
            rows="2"
            placeholder="Ej. Traer zapatillas cómodas. Prohibido fumar."
            data-i18n-placeholder="emprendedor.phRec"
          ></textarea>
        </div>

        <div class="form-group">
          <label id="canalLabel" data-i18n="emprendedor.lblCanal">Canal principal de contacto</label>
          <div class="checkbox-group" role="radiogroup" aria-labelledby="canalLabel">
            <label class="checkbox-item">
              <input type="radio" name="contacto" value="whatsapp" required />
              <span data-i18n="emprendedor.optWhats">WhatsApp</span>
            </label>

            <label class="checkbox-item">
              <input type="radio" name="contacto" value="email" />
              <span data-i18n="emprendedor.optMail">Correo</span>
            </label>

            <label class="checkbox-item">
              <input type="radio" name="contacto" value="instagram" />
              <span data-i18n="emprendedor.optInsta">Instagram</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="datoContacto" data-i18n="emprendedor.lblDato">Número, correo o usuario de contacto</label>
          <input
            type="text"
            id="datoContacto"
            placeholder="Ej. +56 9 1234 5678 o @mi_emprendimiento"
            data-i18n-placeholder="emprendedor.phDato"
            required
          />
        </div>

        <button type="submit" class="btn-submit" data-i18n="emprendedor.btnEnviar">Enviar información</button>
        <p id="mensajeEstado" role="status" style="margin-top:12px;font-weight:600;color:var(--primary);"></p>
      </form>
    </main>

    <footer>
      <div class="footer-links">
        <a href="contacto.html" data-i18n="contacto.contacto">Contacto</a>
        <a href="https://github.com/camilqqq/Nexus-Ecoruta/blob/main/documentos/reportes/reporte-bug-bounty.pdf" target="_blank" rel="noopener">Bug Bounty</a>
        <a href="../index.html" data-i18n="footer.admin">Información</a>
      </div>
    </footer>

    <script src="../js/translations.js"></script>
    <script>
      function actualizarTraduccionesEmprendedor() {
        const lang = localStorage.getItem("selectedLang") || "es";
        const dict = translations[lang] || translations["es"];
        document.querySelectorAll("[data-i18n]").forEach(el => {
          const key = el.getAttribute("data-i18n");
          if (dict[key]) el.innerHTML = dict[key];
        });

        document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
          const key = el.getAttribute("data-i18n-placeholder");
          if (dict[key]) el.placeholder = dict[key];
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        const wrapper = document.getElementById('langDropdownWrapper');
        const selected = document.getElementById('langSelected');
        const menu = document.getElementById('langMenu');
        const flagSpan = document.getElementById('langFlag');
        const textSpan = document.getElementById('langText');

        const currentLang = localStorage.getItem("selectedLang") || "es";
        if (currentLang === 'en') {
          flagSpan.textContent = '🇬🇧';
          textSpan.textContent = 'English';
        } else {
          flagSpan.textContent = '🇪🇸';
          textSpan.textContent = 'Español';
        }

        if (selected && menu) {
          selected.addEventListener('click', (e) => {
            e.stopPropagation();
            menu.classList.toggle('show');
          });

          document.addEventListener('click', () => {
            menu.classList.remove('show');
          });

          menu.querySelectorAll('.custom-lang-option').forEach(option => {
            option.addEventListener('click', () => {
              const val = option.getAttribute('data-value');
              const flag = option.getAttribute('data-flag');
              const name = option.getAttribute('data-name');

              flagSpan.textContent = flag;
              textSpan.textContent = name;
              menu.classList.remove('show');

              localStorage.setItem("selectedLang", val);
              actualizarTraduccionesEmprendedor();
            });
          });
        }

        const themeSelector = document.getElementById("theme-selector");
        if (themeSelector) {
          const savedTheme = localStorage.getItem("selectedTheme") || "normal";
          themeSelector.value = savedTheme;
          applyTheme(savedTheme);

          themeSelector.addEventListener("change", (e) => {
            const selectedTheme = e.target.value;
            localStorage.setItem("selectedTheme", selectedTheme);
            applyTheme(selectedTheme);
          });
        }

        function applyTheme(theme) {
          if (theme === "normal") {
            document.documentElement.removeAttribute("data-theme");
          } else {
            document.documentElement.setAttribute("data-theme", theme);
          }
        }

        actualizarTraduccionesEmprendedor();
      });

      const menuBtn = document.getElementById('menuBtn');
      const menuNav = document.getElementById('menuNav');
      if (menuBtn && menuNav) {
        menuBtn.addEventListener('click', () => {
          const abierto = menuNav.classList.toggle('menu-visible');
          menuBtn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
        });
      }

      const formulario = document.getElementById('formEmprendedor');
      const mensaje = document.getElementById('mensajeEstado');
      if (formulario) {
        formulario.addEventListener('submit', (e) => {
          e.preventDefault();
          const nuevaSolicitud = {
            id: Date.now(),
            nombre: document.getElementById('nombreEmprendimiento').value.trim(),
            descripcion: document.getElementById('descripcionActividad').value.trim(),
            ubicacion: document.getElementById('ubicacion').value.trim(),
            duracionDificultad: document.getElementById('duracionDificultad').value.trim(),
            recomendaciones: document.getElementById('recomendacionesCondiciones').value.trim(),
            canalContacto: formulario.querySelector('input[name="contacto"]:checked')?.value || '',
            datoContacto: document.getElementById('datoContacto').value.trim(),
            fecha: new Date().toLocaleDateString('es-CL'),
            estado: 'Pendiente'
          };
          let solicitudesGuardadas = JSON.parse(localStorage.getItem('solicitudesEmprendedores')) || [];
          solicitudesGuardadas.push(nuevaSolicitud);
          localStorage.setItem('solicitudesEmprendedores', JSON.stringify(solicitudesGuardadas));

          const lang = localStorage.getItem("selectedLang") || "es";
          const dict = translations[lang] || translations["es"];
          if (mensaje) {
            mensaje.textContent = dict["emprendedor.exito"] || '¡Solicitud enviada con éxito! Ya está disponible en la vista de administración.';
          }
          formulario.reset();
        });
      }
    </script>
  </body>
</html>
