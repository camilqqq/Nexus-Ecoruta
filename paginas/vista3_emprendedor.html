<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoRuta Temuco - Emprendedores</title>
    <link rel="stylesheet" href="../css/emprendedor.css" />
  </head>

  <body>

    <header>
      <div class="header-top">
        <div class="brand">
          <img src="../assets/imagenes/Logo.png" alt="Logo EcoRuta Temuco" class="logo" />
          <span class="brand-name">EcoRuta Temuco</span>
        </div>
        <button class="menu-btn" aria-label="Abrir menú" id="menuBtn">☰ Menú</button>
      </div>

      <nav id="menuNav">
        <a href="../index.html">Inicio</a>
        <a href="../index.html#explorar">Explorar</a>
        <a href="vista3_emprendedor.html" class="active" aria-current="page">Emprendedores</a>
        <a href="vista4.html">Administración</a>
      </nav>
    </header>

    <main>
      <h1>"Da a conocer tu emprendimiento"</h1>

      <form class="form-card" id="formEmprendedor">
        <div class="form-group">
          <label for="nombreEmprendimiento">Nombre emprendimiento</label>
          <input
            type="text"
            id="nombreEmprendimiento"
            placeholder="Ej. Guías Locales Ñielol"
            required
          />
        </div>

        <div class="form-group">
          <label for="descripcionActividad">Descripción de la actividad</label>
          <textarea
            id="descripcionActividad"
            rows="3"
            placeholder="Describe en qué consiste la experiencia..."
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="ubicacion">Ubicación</label>
          <input type="text" id="ubicacion" placeholder="Ej. Calle Prat 123, Temuco" required />
        </div>

        <div class="form-group">
          <label for="duracionDificultad">Duración y dificultad</label>
          <input
            type="text"
            id="duracionDificultad"
            placeholder="Ej. 2 horas · Dificultad Fácil"
            required
          />
        </div>

        <div class="form-group">
          <label for="recomendacionesCondiciones">Recomendaciones y condiciones</label>
          <textarea
            id="recomendacionesCondiciones"
            rows="2"
            placeholder="Ej. Traer zapatillas cómodas. Prohibido fumar."
          ></textarea>
        </div>

        <div class="form-group">
          <label id="canalLabel">Canal principal de contacto</label>
          <div class="checkbox-group" role="radiogroup" aria-labelledby="canalLabel">
            <label class="checkbox-item">
              <input type="radio" name="contacto" value="whatsapp" required />
              WhatsApp
            </label>

            <label class="checkbox-item">
              <input type="radio" name="contacto" value="email" />
              Correo
            </label>

            <label class="checkbox-item">
              <input type="radio" name="contacto" value="instagram" />
              Instagram
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="datoContacto">Número, correo o usuario de contacto</label>
          <input
            type="text"
            id="datoContacto"
            placeholder="Ej. +56 9 1234 5678 o @mi_emprendimiento"
            required
          />
        </div>

        <button type="submit" class="btn-submit">Enviar información</button>
        <p id="mensajeEstado" role="status" style="margin-top:12px;font-weight:600;color:#1a4331;"></p>
      </form>
    </main>

    <footer>
      <div class="footer-links">
        <a href="mailto:contacto@ecorutatemuco.cl">Contacto</a>
        <a href="https://github.com/camilqqq/Nexus-Ecoruta/blob/main/documentos/reportes/accesibilidad.md" target="_blank">Accesibilidad</a>
        <a href="../index.html">Información</a>
      </div>
    </footer>

    <script>
      const menuBtn = document.getElementById('menuBtn');
      const menuNav = document.getElementById('menuNav');

      menuBtn.addEventListener('click', () => {
        menuNav.classList.toggle('menu-visible');
      });

      const formulario = document.getElementById('formEmprendedor');
      const mensaje = document.getElementById('mensajeEstado');

      formulario.addEventListener('submit', (e) => {
        e.preventDefault();
        mensaje.textContent =
          'Información validada correctamente. (Prototipo: el guardado se conectará en el Sprint 2).';
        formulario.reset();
      });
    </script>
  </body>
</html>
