<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accede a tu cuenta de Nexus EcoRuta y personaliza tus experiencias de turismo sustentable en La Araucanía.">
  <meta name="theme-color" content="#1b4332">
  <title>Acceso de turistas | Nexus EcoRuta</title>

  <style>
    :root {
      --primary: #1b4332;
      --primary-hover: #2d6a4f;
      --accent: #52b788;
      --background: #f4f6f5;
      --surface: #ffffff;
      --text: #1d2d24;
      --muted: #55645b;
      --border: #c8d6cd;
      --error-bg: #fdecec;
      --error-text: #8c1d18;
      --success-bg: #e2f4e8;
      --success-text: #163b29;
    }

    [data-theme="dark"] {
      --primary: #86efac;
      --primary-hover: #a7f3d0;
      --accent: #6ee7b7;
      --background: #101612;
      --surface: #1a221c;
      --text: #eef4f0;
      --muted: #c2cfc6;
      --border: #43574a;
      --error-bg: #3b191d;
      --error-text: #fecaca;
      --success-bg: #153324;
      --success-text: #bbf7d0;
    }

    [data-theme="colorblind"] {
      --primary: #004b23;
      --primary-hover: #006432;
      --accent: #0077b6;
      --background: #ffffff;
      --surface: #ffffff;
      --text: #000000;
      --muted: #1f2933;
      --border: #000000;
      --error-bg: #fff1f2;
      --error-text: #7f1d1d;
      --success-bg: #ecfdf5;
      --success-text: #064e3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    header {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto 35px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--primary);
      font-weight: 800;
      font-size: 1.3rem;
    }

    .brand img {
      width: 65px;
      height: 55px;
      object-fit: contain;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    main {
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    .card {
      background: var(--surface);
      padding: 35px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      background: var(--background);
      padding: 5px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }

    .tabs button {
      flex: 1;
      padding: 12px 5px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--primary);
      color: #0b140e;
    }

    html:not([data-theme="dark"]) .tabs button.active {
      color: #ffffff;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: var(--text);
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--background);
      color: var(--text);
      font-size: 1rem;
    }

    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    [data-theme="dark"] .submit {
      color: #0d1610;
    }

    .submit:hover {
      background: var(--primary-hover);
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 17px;
      font-size: .92rem;
      line-height: 1.5;
      border: 1px solid transparent;
    }

    .message.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border-color: var(--error-text);
    }

    .message.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border-color: var(--success-text);
    }

    .hidden {
      display: none;
    }

    .guest {
      text-align: center;
      margin-top: 23px;
      color: var(--muted);
      font-size: .92rem;
    }

    .guest a {
      color: var(--primary);
      font-weight: 700;
    }

    footer {
      text-align: center;
      padding: 25px 0 5px;
      color: var(--muted);
      font-size: .85rem;
    }

    @media(max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 24px 19px; }
      h1 { font-size: 1.55rem; }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <img src="../assets/imagenes/Logo.png" alt="Logo Nexus EcoRuta">
    <span>Nexus EcoRuta</span>
  </div>

  <a class="back" id="linkVolverCatalogo" href="../index.html">
    ← Volver al catálogo
  </a>
</header>

<main>
  <section class="card" id="authCard" aria-labelledby="titulo">

    <h1 id="titulo">¡Bienvenido viajero!</h1>

    <p class="subtitle">
      Ingresa o crea tu cuenta para guardar tus rutas favoritas
      y organizar tus próximas experiencias.
    </p>

    <div class="tabs" role="tablist" aria-label="Acceso de usuario">
      <button type="button" id="tabLogin"
        class="active" role="tab"
        aria-selected="true" aria-controls="formLogin">
        Iniciar sesión
      </button>

      <button type="button" id="tabRegistro"
        role="tab" aria-selected="false"
        aria-controls="formRegistro">
        Crear cuenta
      </button>
    </div>

    <div id="mensaje" class="message"
      role="status" aria-live="polite"></div>

    <form id="formLogin" novalidate>

      <div class="field">
        <label for="correoLogin">Correo electrónico</label>
        <input type="email" id="correoLogin" name="correoLogin"
          autocomplete="email" required maxlength="150"
          placeholder="nombre@correo.com">
      </div>

      <div class="field">
        <label for="passwordLogin">Contraseña</label>
        <input type="password" id="passwordLogin" name="passwordLogin"
          autocomplete="current-password"
          required minlength="8" maxlength="72"
          placeholder="Tu contraseña">
      </div>

      <button class="submit" type="submit">
        Iniciar sesión
      </button>
    </form>

    <form id="formRegistro" class="hidden" novalidate>

      <div class="field">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre"
          autocomplete="name" required
          minlength="2" maxlength="100"
          placeholder="Tu nombre">
      </div>

      <div class="field">
        <label for="correoRegistro">Correo electrónico</label>
        <input type="email" id="correoRegistro" name="correoRegistro"
          autocomplete="email" required maxlength="150"
          placeholder="nombre@correo.com">
      </div>

      <div class="field">
        <label for="passwordRegistro">Contraseña</label>
        <input type="password" id="passwordRegistro" name="passwordRegistro"
          autocomplete="new-password"
          required minlength="8" maxlength="72"
          placeholder="Mínimo 8 caracteres">
      </div>

      <div class="field">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input type="password" id="confirmarPassword" name="confirmarPassword"
          autocomplete="new-password"
          required minlength="8" maxlength="72"
          placeholder="Repite tu contraseña">
      </div>

      <button class="submit" type="submit">
        Crear mi cuenta
      </button>
    </form>

    <p class="guest">
      ¿Solo quieres explorar?
      <a href="../index.html">Continuar como visitante</a>
    </p>

  </section>
</main>

<footer>
  Nexus EcoRuta · Turismo sustentable en La Araucanía
</footer>

<script>
  const tema = localStorage.getItem("selectedTheme");
  if (tema === "dark" || tema === "colorblind") {
    document.documentElement.setAttribute("data-theme", tema);
  }

  const tabLogin = document.getElementById("tabLogin");
  const tabRegistro = document.getElementById("tabRegistro");
  const formLogin = document.getElementById("formLogin");
  const formRegistro = document.getElementById("formRegistro");
  const mensaje = document.getElementById("mensaje");
  const authCard = document.getElementById("authCard");

  const SESSION_COOKIE_NAME = "ecoruta_session_meta";
  const SESSION_MAX_AGE_SECONDS = 60 * 60 * 12; // 12 horas
  const USER_STORAGE_KEY = "ecoruta_turista_sesion";
  const REDIRECT_DELAY_MS = 650;

  let temporizadorRedireccion = null;

  function sanitizarTexto(valor, maxLength = 150) {
    if (typeof valor !== "string") return "";
    return valor
      .replace(/[\u0000-\u001F\u007F]/g, "")
      .replace(/[<>]/g, "")
      .trim()
      .slice(0, maxLength);
  }

  function guardarSesionLocal(nombre, correo) {
    const nombreLimpio = sanitizarTexto(nombre, 100) || correo.split("@")[0] || "Viajero";
    const correoLimpio = sanitizarTexto(correo, 150).toLowerCase();
    const seguro = window.location.protocol === "https:" ? "; Secure" : "";

    const perfil = {
      id: correoLimpio || nombreLimpio.toLowerCase().replace(/\s+/g, "_"),
      nombre: nombreLimpio,
      correo: correoLimpio,
      iniciadoEn: Date.now()
    };

    try {
      localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(perfil));
    } catch (_) {
      // Ignorar si localStorage no está disponible
    }

    document.cookie = `${SESSION_COOKIE_NAME}=${encodeURIComponent(perfil.id)}; max-age=${SESSION_MAX_AGE_SECONDS}; SameSite=Lax; path=/${seguro}`;
  }

  function limpiarSesionYCookies() {
    if (temporizadorRedireccion) {
      clearTimeout(temporizadorRedireccion);
      temporizadorRedireccion = null;
    }
    const seguro = window.location.protocol === "https:" ? "; Secure" : "";
    document.cookie = `${SESSION_COOKIE_NAME}=; max-age=0; SameSite=Lax; path=/${seguro}`;
    document.cookie = `nexus_session=; max-age=0; SameSite=Lax; path=/${seguro}`;
    try {
      localStorage.removeItem(USER_STORAGE_KEY);
      sessionStorage.removeItem("ecoruta_user");
    } catch (_) {
      // Ignorar si el almacenamiento no está disponible
    }
  }

  function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.className = "message " + tipo;
  }

  function redirigirAlCatalogo() {
    if (temporizadorRedireccion) {
      clearTimeout(temporizadorRedireccion);
    }
    temporizadorRedireccion = setTimeout(() => {
      window.location.href = "../index.html";
    }, REDIRECT_DELAY_MS);
  }

  function cambiarVista(registro) {
    if (temporizadorRedireccion) {
      clearTimeout(temporizadorRedireccion);
      temporizadorRedireccion = null;
    }
    formLogin.classList.toggle("hidden", registro);
    formRegistro.classList.toggle("hidden", !registro);

    tabLogin.classList.toggle("active", !registro);
    tabRegistro.classList.toggle("active", registro);

    tabLogin.setAttribute("aria-selected", String(!registro));
    tabRegistro.setAttribute("aria-selected", String(registro));

    mensaje.className = "message";
    mensaje.textContent = "";

    if (registro) {
      document.getElementById("nombre").focus();
    } else {
      document.getElementById("correoLogin").focus();
    }
  }

  tabLogin.addEventListener("click", () => cambiarVista(false));
  tabRegistro.addEventListener("click", () => cambiarVista(true));

  function correoValido(correo) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo);
  }

  formLogin.addEventListener("submit", function(event) {
    event.preventDefault();

    const correo = sanitizarTexto(document.getElementById("correoLogin").value, 150).toLowerCase();
    const password = document.getElementById("passwordLogin").value;

    if (!correoValido(correo)) {
      mostrarMensaje("Ingresa un correo electrónico válido.", "error");
      document.getElementById("correoLogin").focus();
      return;
    }

    if (password.length < 8) {
      mostrarMensaje("La contraseña debe tener al menos 8 caracteres.", "error");
      document.getElementById("passwordLogin").focus();
      return;
    }

    guardarSesionLocal("", correo);
    mostrarMensaje(
      "Sesión iniciada. Redirigiendo al catálogo...",
      "success"
    );
    redirigirAlCatalogo();
  });

  formRegistro.addEventListener("submit", function(event) {
    event.preventDefault();

    const nombre = sanitizarTexto(document.getElementById("nombre").value, 100);
    const correo = sanitizarTexto(document.getElementById("correoRegistro").value, 150).toLowerCase();
    const password = document.getElementById("passwordRegistro").value;
    const confirmar = document.getElementById("confirmarPassword").value;

    if (nombre.length < 2 || nombre.length > 100) {
      mostrarMensaje("Ingresa un nombre válido (entre 2 y 100 caracteres).", "error");
      document.getElementById("nombre").focus();
      return;
    }

    if (!correoValido(correo)) {
      mostrarMensaje("Ingresa un correo electrónico válido.", "error");
      document.getElementById("correoRegistro").focus();
      return;
    }

    if (password.length < 8) {
      mostrarMensaje("La contraseña debe tener al menos 8 caracteres.", "error");
      document.getElementById("passwordRegistro").focus();
      return;
    }

    if (password !== confirmar) {
      mostrarMensaje("Las contraseñas no coinciden.", "error");
      document.getElementById("confirmarPassword").focus();
      return;
    }

    guardarSesionLocal(nombre, correo);
    mostrarMensaje(
      "Cuenta creada. Redirigiendo al catálogo...",
      "success"
    );
    redirigirAlCatalogo();
  });

  authCard.addEventListener("keydown", function(event) {
    if (event.key !== "Tab") return;
    const focusables = authCard.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), [tabindex]:not([tabindex="-1"])'
    );
    const visibleFocusables = Array.from(focusables).filter((el) => el.offsetParent !== null);
    if (!visibleFocusables.length) return;

    const first = visibleFocusables[0];
    const last = visibleFocusables[visibleFocusables.length - 1];

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
      limpiarSesionYCookies();
      window.location.href = "../index.html";
    }
  });

  window.addEventListener("ecoruta:logout", limpiarSesionYCookies);
</script>

</body>
</html>
