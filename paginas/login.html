
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accede a tu cuenta de Nexus EcoRuta y personaliza tus experiencias de turismo sustentable en La Araucanía.">
  <meta name="theme-color" content="#1b4332">
  <title>Acceso de turistas | Nexus EcoRuta</title>

  <style>
    :root {
      --primary: #1b4332;
      --accent: #52b788;
      --background: #f4f6f5;
      --surface: #ffffff;
      --text: #1d2d24;
      --muted: #5e6d64;
      --border: #dce5df;
      --error: #b42318;
    }

    [data-theme="dark"] {
      --primary: #74c69d;
      --background: #121814;
      --surface: #1e2620;
      --text: #e0e6e2;
      --muted: #b0bdb4;
      --border: #3a4940;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    header {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto 35px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--primary);
      font-weight: 800;
      font-size: 1.3rem;
    }

    .brand img {
      width: 65px;
      height: 55px;
      object-fit: contain;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    main {
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    .card {
      background: var(--surface);
      padding: 35px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      background: var(--background);
      padding: 5px;
      border-radius: 9px;
    }

    .tabs button {
      flex: 1;
      padding: 12px 5px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--primary);
      color: white;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--background);
      color: var(--text);
      font-size: 1rem;
    }

    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .submit:hover {
      background: #2d6a4f;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 17px;
      font-size: .92rem;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fce8e6;
      color: #8c1d18;
    }

    .message.success {
      display: block;
      background: #e2f4e8;
      color: #1b4332;
    }

    .hidden {
      display: none;
    }

    .guest {
      text-align: center;
      margin-top: 23px;
      color: var(--muted);
      font-size: .92rem;
    }

    .guest a {
      color: var(--primary);
      font-weight: 700;
    }

    footer {
      text-align: center;
      padding: 25px 0 5px;
      color: var(--muted);
      font-size: .85rem;
    }

    @media(max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 24px 19px; }
      h1 { font-size: 1.55rem; }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <img src="../assets/imagenes/Logo.png" alt="Logo Nexus EcoRuta">
    <span>Nexus EcoRuta</span>
  </div>

  <a class="back" href="../index.html">
    ← Volver al catálogo
  </a>
</header>

<main>
  <section class="card" aria-labelledby="titulo">

    <h1 id="titulo">¡Bienvenido viajero!</h1>

    <p class="subtitle">
      Ingresa o crea tu cuenta para guardar tus rutas favoritas
      y organizar tus próximas experiencias.
    </p>

    <div class="tabs" role="tablist" aria-label="Acceso de usuario">
      <button type="button" id="tabLogin"
        class="active" role="tab"
        aria-selected="true" aria-controls="formLogin">
        Iniciar sesión
      </button>

      <button type="button" id="tabRegistro"
        role="tab" aria-selected="false"
        aria-controls="formRegistro">
        Crear cuenta
      </button>
    </div>

    <div id="mensaje" class="message"
      role="status" aria-live="polite"></div>

    <form id="formLogin" novalidate>

      <div class="field">
        <label for="correoLogin">Correo electrónico</label>
        <input type="email" id="correoLogin"
          autocomplete="email" required
          placeholder="nombre@correo.com">
      </div>

      <div class="field">
        <label for="passwordLogin">Contraseña</label>
        <input type="password" id="passwordLogin"
          autocomplete="current-password"
          required minlength="8"
          placeholder="Tu contraseña">
      </div>

      <button class="submit" type="submit">
        Iniciar sesión
      </button>
    </form>

    <form id="formRegistro" class="hidden" novalidate>

      <div class="field">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre"
          autocomplete="name" required
          maxlength="100"
          placeholder="Tu nombre">
      </div>

      <div class="field">
        <label for="correoRegistro">Correo electrónico</label>
        <input type="email" id="correoRegistro"
          autocomplete="email" required
          placeholder="nombre@correo.com">
      </div>

      <div class="field">
        <label for="passwordRegistro">Contraseña</label>
        <input type="password" id="passwordRegistro"
          autocomplete="new-password"
          required minlength="8"
          placeholder="Mínimo 8 caracteres">
      </div>

      <div class="field">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input type="password" id="confirmarPassword"
          autocomplete="new-password"
          required minlength="8"
          placeholder="Repite tu contraseña">
      </div>

      <button class="submit" type="submit">
        Crear mi cuenta
      </button>
    </form>

    <p class="guest">
      ¿Solo quieres explorar?
      <a href="../index.html">Continuar como visitante</a>
    </p>

  </section>
</main>

<footer>
  Nexus EcoRuta · Turismo sustentable en La Araucanía
</footer>

<script>
  const tabLogin = document.getElementById("tabLogin");
  const tabRegistro = document.getElementById("tabRegistro");
  const formLogin = document.getElementById("formLogin");
  const formRegistro = document.getElementById("formRegistro");
  const mensaje = document.getElementById("mensaje");

  function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.className = "message " + tipo;
  }

  function cambiarVista(registro) {
    formLogin.classList.toggle("hidden", registro);
    formRegistro.classList.toggle("hidden", !registro);

    tabLogin.classList.toggle("active", !registro);
    tabRegistro.classList.toggle("active", registro);

    tabLogin.setAttribute("aria-selected", String(!registro));
    tabRegistro.setAttribute("aria-selected", String(registro));

    mensaje.className = "message";
    mensaje.textContent = "";

    if (registro) {
      document.getElementById("nombre").focus();
    } else {
      document.getElementById("correoLogin").focus();
    }
  }

  tabLogin.addEventListener("click", () => cambiarVista(false));
  tabRegistro.addEventListener("click", () => cambiarVista(true));

  function correoValido(correo) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);
  }

  formLogin.addEventListener("submit", function(event) {
    event.preventDefault();

    const correo = document.getElementById("correoLogin").value.trim();
    const password = document.getElementById("passwordLogin").value;

    if (!correoValido(correo)) {
      mostrarMensaje("Ingresa un correo electrónico válido.", "error");
      return;
    }

    if (password.length < 8) {
      mostrarMensaje("La contraseña debe tener al menos 8 caracteres.", "error");
      return;
    }

    mostrarMensaje(
      "Formulario validado. La conexión con el servidor de autenticación está pendiente de configuración.",
      "success"
    );
  });

  formRegistro.addEventListener("submit", function(event) {
    event.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();
    const correo = document.getElementById("correoRegistro").value.trim();
    const password = document.getElementById("passwordRegistro").value;
    const confirmar = document.getElementById("confirmarPassword").value;

    if (nombre.length < 2 || nombre.length > 100) {
      mostrarMensaje("Ingresa un nombre válido.", "error");
      return;
    }

    if (!correoValido(correo)) {
      mostrarMensaje("Ingresa un correo electrónico válido.", "error");
      return;
    }

    if (password.length < 8) {
      mostrarMensaje("La contraseña debe tener al menos 8 caracteres.", "error");
      return;
    }

    if (password !== confirmar) {
      mostrarMensaje("Las contraseñas no coinciden.", "error");
      return;
    }

    mostrarMensaje(
      "Datos validados correctamente. Falta conectar el registro con el servidor para crear tu cuenta.",
      "success"
    );
  });

  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
      window.location.href = "../index.html";
    }
  });

  const tema = localStorage.getItem("selectedTheme");

  if (tema === "dark" || tema === "colorblind") {
    document.documentElement.setAttribute("data-theme", tema);
  }
</script>

</body>
</html>
