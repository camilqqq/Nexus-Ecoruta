<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administración - EcoRuta Temuco</title>
    <link rel="stylesheet" href="style-admin.css" />
  </head>

  <body>
    <header>
      <div class="header">
        <div class="brand">
          <div class="logo">ER</div>

          <div>
            <h2>EcoRuta Temuco</h2>
            <p>Turismo sustentable • Temuco</p>
          </div>
        </div>

        <nav>
          <a href="index.html">Inicio</a>
          <a href="#explorar">Explorar</a>
          <a href="#emprendedores">Emprendedores</a>
        </nav>

        <button class="menu">☰ Menú</button>
      </div>
    </header>

    <main>
      <h1>Administración</h1>

      <div class="tabs">
        <button class="active">Fichas</button>
        <button>Solicitudes</button>
      </div>

      <section class="cards">
        <article class="card">
          <h2>Fichas</h2>

          <div class="status">
            <p>Verificado</p>
            <p>Pendiente</p>
          </div>

          <button class="edit">Editar</button>
        </article>
      </section>

      <section class="statistics">
        <h2>Estadísticas</h2>

        <p>Vistas: 0</p>
        <p>Clics: 0</p>
      </section>

      <section class="notices">
        <h2>Avisos</h2>

        <button class="new-notice">+ Nuevo Aviso</button>
      </section>
    </main>

    <footer>
      <span>EcoRuta Temuco</span>

      <div>
        <a href="#contacto">Contacto</a>
        <a href="#accesibilidad">Accesibilidad</a>
        <a href="#informacion">Información</a>
      </div>
    </footer>
  </body>
</html>
